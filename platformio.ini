; PlatformIO Configuration for Silicon DB v3.0
; Target: Arduino Uno (ATmega328P)

[env:uno]
platform = atmelavr
board = uno

; NO framework - we're using bare-metal AVR-libc
; framework = arduino  ; REMOVED - we write directly to registers

; Build settings
build_flags = 
    -DF_CPU=16000000UL
    -Os

; Serial monitor configuration
monitor_speed = 9600

; Upload settings  
upload_protocol = arduino
upload_speed = 115200
